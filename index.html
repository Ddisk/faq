<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>iCAD相談窓口｜体験デモ</title><style>
:root{color-scheme:dark;--bg:#101725;--panel:#192335;--line:#344257;--text:#edf3ff;--muted:#adbbd0;--blue:#89b9ff;--green:#77dfbd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.8 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#25364e;color:var(--text);padding:10px 16px}button:hover{background:#354e70}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button.primary{background:#96c2ff;color:#10223c;border-color:#96c2ff;font-weight:700}button.small{padding:5px 12px;font-size:14px}button.danger{color:#ffb5b5}input,textarea,select{width:100%;border:1px solid #5b6c84;border-radius:8px;padding:10px;background:#101a2b;color:var(--text)}textarea{min-height:96px;resize:vertical}a{color:var(--blue)}h1{font-size:25px;margin:0}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:10px 0}p{margin:8px 0 16px}header{max-width:1240px;margin:auto;padding:28px 24px 18px;display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{color:var(--green);letter-spacing:.12em;font-size:12px;font-weight:700}.subtitle,.muted{color:var(--muted);font-size:14px}.wrap{max-width:1240px;padding:0 24px 50px;margin:auto}.notice{background:#22304a;border:1px solid #3c5379;border-radius:12px;padding:12px 16px;font-size:13px;color:#d0def4}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs .active{background:var(--text);color:#172239}.grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}.side{align-self:start}.step{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.step b{color:var(--green);margin-right:8px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.chat{max-height:540px;min-height:300px;overflow-y:auto;padding:6px 10px 18px 0;scroll-behavior:smooth}.bubble{background:#26344a;border:1px solid #3a4a62;border-radius:14px 14px 14px 2px;padding:14px 18px;max-width:90%;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{margin-left:auto;background:#204b64;border-radius:14px 14px 2px 14px}.speaker{font-size:11px;color:#b4d8ff;display:block;margin-bottom:3px}.composer{border-top:1px solid var(--line);padding-top:18px}.choices{display:grid;gap:10px}.choices button{text-align:left;padding:17px}.tag{display:inline-block;background:#2c4564;border-radius:999px;padding:2px 10px;font-size:12px}.tag.green{background:#215345;color:#a0f4d2}.tag.amber{background:#5b4625;color:#ffe0a0}.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;background:#162031}.card p{white-space:pre-wrap;overflow-wrap:anywhere}.label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat{background:#111d2e;border-radius:10px;padding:12px}.stat strong{display:block;font-size:25px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#d5f9ec;color:#123c2e;padding:12px 20px;border-radius:12px;z-index:20;max-width:95%}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:680px;width:92%;padding:25px}dialog::backdrop{background:#000a}.preview{max-width:240px;max-height:180px;display:block;border-radius:8px}.topgap{margin-top:16px}.mobile-persona{display:none}.empty{text-align:center;color:var(--muted);padding:35px 10px}summary{cursor:pointer;color:var(--blue)}.help{font-size:13px;color:var(--muted)}footer{margin-top:20px;color:var(--muted);font-size:12px}.unread{border-left:4px solid var(--green)}@media(max-width:760px){header{align-items:start;padding:20px 16px}.wrap{padding:0 16px 35px}.grid,.split{grid-template-columns:1fr}.side{display:none}.mobile-persona{display:block;margin-bottom:14px}.panel{padding:16px}.bubble{max-width:97%}.stats{gap:6px}.stat{padding:8px}.stat strong{font-size:22px}h1{font-size:21px}}@media(prefers-reduced-motion:reduce){.chat{scroll-behavior:auto}}
</style></head><body>
<header><div><div class="eyebrow">ICAD SUPPORT / INTERACTIVE DEMO</div><h1>iCAD相談窓口</h1><div class="subtitle">相談する人にも、対応する人にも、分かりやすく。</div></div><span class="tag">体験デモ</span></header>
<div class="wrap"><div class="notice">このデモは実際のAI・Teams・Excel・iCADには接続しません。回答は架空の例です。記録はこのブラウザー内だけに保存され、他の人・端末とは共有されません。画像の文字読み取りは行いません。実際の個人情報や社内資料は入力しないでください。</div>
<nav class="tabs" aria-label="画面切り替え"><button data-tab="chat">相談する</button><button data-tab="admin">担当者の画面</button><button data-tab="inbox">連絡を確認 <span id="inbox-count"></span></button><button data-tab="settings">資料・担当者の設定</button><button data-tab="guide">試し方・GitHubへの置き方</button></nav>
<main id="app"></main><footer>ブラウザー内保存の体験版です。担当者の切り替えは体験用で、本人確認や権限管理の機能はありません。</footer></div><dialog id="doc"><div id="doc-body"></div><button onclick="document.getElementById('doc').close()">閉じる</button></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const KEY='icad-support-demo-v1';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7), now=()=>new Date().toLocaleString('ja-JP');
const seed=()=>({staff:['担当者A','担当者B','担当者C'],docs:[{id:'start',title:'【架空資料】更新後に起動しない場合',keys:'起動,開かない,開始',body:'これは動作確認用の架空資料です。実際のiCADの手順ではありません。\n1. 表示されたメッセージを記録します。\n2. 保存済みの社内更新マニュアルと照合します。\n3. 判断できない場合は担当者に相談します。',url:''},{id:'button',title:'【架空資料】更新前後のボタン配置一覧',keys:'ボタン,配置,場所,メニュー,移動',body:'これは画面の動きを確認するための架空資料です。実際のボタン配置を示すものではありません。\n更新前後の配置を記載した資料から、該当する操作名を調べて案内する想定です。\n本番では、ボタンの旧名称・新名称・配置・該当ページを登録してください。',url:''}],tickets:[{id:'123',category:'エラー',question:'更新後にiCADが起動しない',version:'体験用バージョン',status:'対応中',owner:'担当者A',created:now(),notes:'メーカーへ確認中（架空の例）',answer:'',approved:false,docId:'start',watchers:[],requests:[{name:'体験者A',contact:'demo-a@example.invalid',question:'更新後にiCADが起動しない'}],history:[{at:now(),by:'担当者A',text:'対応を開始しました。'}]}],messages:[],next:124});
let db,storageOK=true;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed();storageOK=false}let tab='chat',staff=db.staff[0]||'担当者',person={name:'体験者A',contact:'demo-a@example.invalid'},session;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{storageOK=false;toast('保存できませんでした。この画面を閉じると変更が失われる場合があります。')}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,4200)}
function start(){session={stage:'choose',category:'',question:'',version:'',image:null,messages:[{text:'iCADについて、どのようなことでお困りですか？'}],answer:'',docId:'',ticketId:null,result:'',notify:false};}
start();
function say(text,user=false){session.messages.push({text,user})}
function go(t){tab=t;render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#inbox-count').textContent=db.messages.filter(m=>m.contact===person.contact&&!m.read).length||'';({chat:renderChat,admin:renderAdmin,inbox:renderInbox,settings:renderSettings,guide:renderGuide})[tab]();}
function renderChat(){const s=session;$('#app').innerHTML=`<div class="grid"><aside class="panel side"><div class="eyebrow">相談の流れ</div><h2>一つずつ、ご案内します</h2><div class="step"><b>01</b>困っていることを選ぶ</div><div class="step"><b>02</b>内容・画面を伝える</div><div class="step"><b>03</b>案内や対応状況を確認</div><div class="step"><b>04</b>結果を確認して保存</div><p class="help topgap">相談内容を担当者と共有する前に、必ず確認します。</p><button class="small" onclick="resetChat()">新しく相談する</button><label class="label" for="persona">体験する利用者</label><select id="persona" onchange="changePerson(this.value)"><option value="A" ${person.name==='体験者A'?'selected':''}>体験者A</option><option value="B" ${person.name==='体験者B'?'selected':''}>体験者B</option></select><p class="help">利用者を変えて同じ相談をすると、連絡希望者の登録を試せます。</p></aside><section class="panel"><div class="row" style="justify-content:space-between"><div><h2>相談する</h2><span class="muted">${esc(person.name)} ／ 自動応答の体験</span></div><button class="small" onclick="resetChat()">最初から</button></div><div class="mobile-persona"><label class="label" for="mobile-persona">体験する利用者</label><select id="mobile-persona" onchange="changePerson(this.value)"><option value="A" ${person.name==='体験者A'?'selected':''}>体験者A</option><option value="B" ${person.name==='体験者B'?'selected':''}>体験者B</option></select></div><div class="chat" id="chat-log" role="log" aria-label="相談のやり取り">${s.messages.map(m=>`<div class="bubble ${m.user?'user':''}"><span class="speaker">${m.user?'あなた':'iCAD相談窓口'}</span>${esc(m.text)}</div>`).join('')}${s.image?`<div class="card"><span class="help">受付画像（この相談中のみ表示・記録への保存なし）</span><img class="preview" src="${s.image}" alt="受け付けた画像"><p class="help">画像の文字は読み取れません。下の入力欄にエラー内容も入力してください。</p></div>`:''}</div><div class="composer" id="composer"></div></section></div>`;
const c=$('#composer');
if(s.stage==='choose')c.innerHTML=`<div class="choices"><button class="primary" onclick="choose('エラー')">エラーが出る・うまくいかない →</button><button onclick="choose('その他')">その他の問い合わせ →</button></div>`;
if(s.stage==='input')c.innerHTML=`<form id="question-form"><label class="label" for="question">${s.category==='エラー'?'エラーの文章、または困っている状況':'知りたいこと'}</label><textarea id="question" required maxlength="3000" placeholder="${s.category==='エラー'?'例：更新後にiCADが起動しない':'例：更新前に使っていたボタンの場所が分からない'}">${esc(s.question)}</textarea>${s.category==='エラー'?'<label class="label" for="image">画像を添付（任意・3MBまで）</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp" onchange="attachImage(this)">':''}<label class="label" for="version">iCADのバージョン（任意）</label><input id="version" maxlength="100" placeholder="分からなければ空欄で大丈夫です" value="${esc(s.version)}"><p class="help">体験用：「起動しない」は対応中、「ボタン」は資料案内、ほかの内容は担当者への相談になります。</p><button class="primary topgap" type="submit">この内容で相談する</button></form>`;
if(s.stage==='match')c.innerHTML=`<p>この問題と、状況は同じですか？</p><div class="row"><button class="primary" onclick="confirmMatch()">同じ問題です</button><button onclick="different()">自分の状況は違います</button></div>`;
if(s.stage==='result')c.innerHTML=`${docButton(s.docId)}<p class="topgap">問題は解決しましたか？</p><div class="row"><button class="primary" onclick="resolved()">解決した</button><button onclick="unresolved()">まだ解決していない</button></div>`;
if(s.stage==='notify')c.innerHTML=`<p>解決後、チャットで連絡を受け取りますか？</p><div class="row"><button class="primary" onclick="wantContact(true)">連絡を希望する</button><button onclick="wantContact(false)">連絡は不要</button></div>`;
if(s.stage==='identity')c.innerHTML=`<form id="identity-form"><p>連絡先を確認してください。</p><label class="label" for="name">名前（体験用）</label><input id="name" required maxlength="80" value="${esc(person.name)}"><label class="label" for="contact">会社のアカウント（体験用）</label><input id="contact" type="email" required maxlength="200" value="${esc(person.contact)}"><p class="help">実際のTeamsでは、会社のアカウントと結び付ける想定です。</p><button class="primary topgap">この連絡先で進む</button></form>`;
if(s.stage==='summary')c.innerHTML=`<div class="card"><h3>今回の相談内容</h3><label class="label" for="summary-q">質問内容（修正できます）</label><textarea id="summary-q" maxlength="3000">${esc(s.question)}</textarea><p><b>${s.result==='解決'?'解決方法':'案内した内容・対応状況'}</b><br>${esc(s.answer)}</p><p>結果：${esc(s.result)}<br>解決後の連絡：${s.notify?'希望する':'不要'}</p>${docButton(s.docId)}</div><p>この内容を担当者に伝え、今後の問い合わせ対応に使うために保存してもよいですか？</p><div class="row"><button class="primary" onclick="commit()">OK・共有して保存</button><button onclick="decline()">共有・保存しない</button></div><p class="help">このデモではブラウザー内へ保存するだけです。</p>`;
if(s.stage==='done')c.innerHTML='<button class="primary" onclick="resetChat()">新しく相談する</button> <button onclick="go(\'admin\')">担当者の画面で確認する</button>';
if($('#question-form'))$('#question-form').onsubmit=e=>{e.preventDefault();ask()};if($('#identity-form'))$('#identity-form').onsubmit=e=>{e.preventDefault();person={name:$('#name').value.trim(),contact:$('#contact').value.trim().toLowerCase()};if(!person.name)return;makeSummary()};$('#chat-log').scrollTop=$('#chat-log').scrollHeight;}
function resetChat(){if(session.stage!=='choose'&&session.stage!=='done'&&!confirm('現在の相談を終了して、最初から始めますか？'))return;start();render()}
function changePerson(v){person={name:'体験者'+v,contact:'demo-'+v.toLowerCase()+'@example.invalid'};start();render()}
function choose(cat){session.category=cat;session.stage='input';say(cat==='エラー'?'エラーが出る・うまくいかない':'その他の問い合わせ',true);say(cat==='エラー'?'エラー画面の画像を送るか、画面に表示されている文章をそのまま入力してください。\nエラーが表示されない場合は、どんな操作をして、どうなったか教えてください。':'知りたいことを入力してください。\n例：更新前に使っていたボタンの場所が分からない');render()}
function attachImage(input){const f=input.files[0];if(!f)return;session.question=$('#question').value;session.version=$('#version').value;if(f.size>3*1024*1024||!['image/png','image/jpeg','image/webp'].includes(f.type)){input.value='';toast('PNG・JPEG・WebPの画像を3MB以内で選んでください。');return}const r=new FileReader();r.onload=()=>{session.image=r.result;render()};r.readAsDataURL(f)}
function docButton(id){const d=db.docs.find(d=>d.id===id);return d?`<button class="small" onclick="openDoc('${d.id}')">資料を開く：${esc(d.title)}</button>`:''}
function openDoc(id){const d=db.docs.find(x=>x.id===id);if(!d)return;$('#doc-body').innerHTML=`<span class="tag">登録資料</span><h2>${esc(d.title)}</h2><p style="white-space:pre-wrap">${esc(d.body)}</p>${safeURL(d.url)?`<p><a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">元の資料を開く ↗</a></p>`:'<p class="help">架空資料のため、外部リンクは登録されていません。</p>'}`;$('#doc').showModal()}
function safeURL(s){try{return ['https:','http:'].includes(new URL(s).protocol)}catch{return false}}
function relevant(q,t){return q.replace(/\s/g,'')===t.question.replace(/\s/g,'')||(/起動|開かない/.test(q)&&/起動|開かない/.test(t.question))}
function ask(){const s=session;s.question=$('#question').value.trim();s.version=$('#version').value.trim();if(!s.question)return;say(s.question+(s.version?'\nバージョン：'+s.version:''),true);const match=db.tickets.find(t=>t.category===s.category&&relevant(s.question,t)&&(!s.version||!t.version||t.version==='体験用バージョン'||s.version===t.version)&&(t.status!=='解決済み'||t.approved));if(match){s.ticketId=match.id;s.docId=match.docId||'';say('似た内容の問い合わせが見つかりました。\n受付番号：'+match.id+'\n内容：'+match.question+'\n対象バージョン：'+(match.version||'未確認')+'\n状態：'+match.status+'\n\n同じ問題か確認してください。（デモでは単純なキーワード照合です）');s.stage='match';render();return}answerFromDocs()}
function confirmMatch(){const t=db.tickets.find(t=>t.id===session.ticketId);if(!t){toast('問い合わせが見つかりません。もう一度相談してください。');return}if(t.status==='解決済み'&&t.approved){session.answer=t.answer;session.stage='result';say('確認済みの解決事例をご案内します。\n'+t.answer)}else{session.answer='受付番号'+t.id+'：'+(t.status==='未対応'?'担当者へ確認を依頼しています。':'担当者が対応しています。')+(t.notes?'\n状況：'+t.notes:'');session.result='未解決';session.stage='notify';say(session.answer)}render()}
function different(){session.ticketId=null;say('状況が異なるため、別の問い合わせとして進めます。');answerFromDocs()}
function answerFromDocs(){const s=session;const d=db.docs.find(d=>d.keys.split(/[,、]/).map(k=>k.trim()).filter(Boolean).some(k=>s.question.includes(k)));if(d){s.docId=d.id;s.answer=d.body;say('登録資料「'+d.title+'」をもとにした案内例です。\n'+d.body);s.stage='result'}else{s.answer='該当する解決方法が見つからないため、担当者への確認が必要です。';s.result='未解決';s.stage='notify';say(s.answer)}render()}
function resolved(){session.result='解決';session.notify=false;say('解決した',true);makeSummary()}
function unresolved(){session.result='未解決';session.stage='notify';say('まだ解決していない',true);say('担当者に相談するため、ここまでの内容をまとめます。');render()}
function wantContact(want){session.notify=want;say(want?'連絡を希望する':'連絡は不要',true);if(want){session.stage='identity';render()}else makeSummary()}
function makeSummary(){session.stage='summary';say('内容を確認し、共有・保存するか選んでください。');render()}
function commit(){const s=session;s.question=$('#summary-q').value.trim();if(!s.question){toast('質問内容を入力してください。');return}let t=db.tickets.find(t=>t.id===s.ticketId);if(!t||t.status==='解決済み'){t={id:String(db.next++),category:s.category,question:s.question,version:s.version,status:s.result==='解決'?'解決済み':'未対応',owner:'',created:now(),notes:'',answer:s.answer,approved:false,docId:s.docId,watchers:[],requests:[],history:[]};db.tickets.unshift(t)}t.requests.push({name:person.name,contact:person.contact,question:s.question});if(s.notify&&!t.watchers.some(w=>w.contact===person.contact))t.watchers.push({...person});t.history.push({at:now(),by:person.name,text:'相談内容の共有・保存に同意'+(s.notify?'。解決後の連絡を希望':'')});save();s.stage='done';say('問い合わせを受け付けました。\n受付番号：'+t.id+'\n'+(s.notify?'連絡先を登録しました。解決後の連絡をお待ちください。':'解決後の連絡は希望しない設定です。')+'\n（体験用：担当者の画面に反映しました）');render()}
function decline(){session.stage='done';say('共有・保存は行いませんでした。担当者への連絡依頼も登録していません。\n相談内容と画像の表示は「最初から」で消えます。');render()}
function renderAdmin(){const tickets=db.tickets;$('#app').innerHTML=`<section class="panel"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">SUPPORT DESK</div><h2>担当者の画面</h2></div><div><label class="label" for="staff">操作する担当者（体験用）</label><select id="staff" onchange="staff=this.value;render()">${db.staff.map(x=>`<option ${x===staff?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><p class="muted">全担当者が同じ一覧を確認し、対応を引き受けたり、引き継いだりできます。</p><div class="stats"><div class="stat"><span class="help">未対応</span><strong>${tickets.filter(t=>t.status==='未対応').length}</strong></div><div class="stat"><span class="help">対応中・確認中</span><strong>${tickets.filter(t=>['対応中','メーカーへ確認中'].includes(t.status)).length}</strong></div><div class="stat"><span class="help">承認済みFAQ</span><strong>${tickets.filter(t=>t.approved&&t.status==='解決済み').length}</strong></div></div><div class="row"><button class="small" onclick="exportCSV(false)">問い合わせ一覧をCSVで保存</button><button class="small" onclick="exportCSV(true)">承認済みFAQをCSVで保存</button></div><p class="help">CSVはExcelで開けます。実際のExcelファイルへの接続・自動追記は行いません。</p>${tickets.map(t=>`<article class="card"><div class="row"><span class="tag ${t.status==='解決済み'?'green':'amber'}">${esc(t.status)}</span><span class="muted">受付番号 ${esc(t.id)} ／ ${esc(t.created)}</span></div><h3>${esc(t.question)}</h3><p class="help">${esc(t.category)} ／ バージョン：${esc(t.version||'未確認')} ／ 相談 ${t.requests.length}件 ／ 連絡希望 ${t.watchers.length}名</p><div class="split"><div><label class="label" for="owner-${t.id}">主な担当者</label><select id="owner-${t.id}" onchange="assign('${t.id}',this.value)"><option value="">未定</option>${db.staff.map(x=>`<option ${x===t.owner?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="small topgap" onclick="claim('${t.id}')">自分が対応する</button><label class="label" for="state-${t.id}">対応状況</label><select id="state-${t.id}" onchange="statusChange('${t.id}',this.value)">${['未対応','対応中','メーカーへ確認中','解決済み'].map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select><label class="label" for="notes-${t.id}">利用者にも案内する対応状況</label><textarea id="notes-${t.id}" maxlength="3000">${esc(t.notes)}</textarea><button class="small" onclick="saveNotes('${t.id}')">対応状況を保存</button></div><div><label class="label" for="answer-${t.id}">解決方法・利用者への連絡内容</label><textarea id="answer-${t.id}" maxlength="5000" placeholder="確認できた操作方法と注意事項を入力">${esc(t.answer||'')}</textarea><div class="row topgap"><button class="primary small" onclick="solve('${t.id}')">解決として登録</button><button class="small" onclick="approve('${t.id}')">${t.approved?'FAQ採用を取り消す':'確認済みFAQに採用'}</button></div><p class="help">${t.approved?'確認済みFAQとして次の相談に使用します。':'FAQへの採用前は、解決済みでも自動回答には使用しません。'}</p><button class="small" onclick="draft('${t.id}')">連絡希望者への連絡文を確認</button></div></div><details class="topgap"><summary>相談者・連絡希望者・対応履歴を見る</summary><h3>相談者</h3>${t.requests.map(r=>`<p class="help">${esc(r.name)} ／ ${esc(r.contact)}<br>${esc(r.question)}</p>`).join('')}<h3>解決後の連絡希望者</h3>${t.watchers.map((w,wi)=>`<p class="help">${esc(w.name)} ／ ${esc(w.contact)} <button class="small" onclick="direct('${t.id}',${wi})">個別に連絡</button></p>`).join('')||'<p class="help">登録はありません。</p>'}<h3>対応履歴</h3>${t.history.map(h=>`<p class="help">${esc(h.at)} ／ ${esc(h.by)}<br>${esc(h.text)}</p>`).join('')}</details></article>`).join('')||'<p class="empty">問い合わせはありません。</p>'}</section>`}
function ticket(id){return db.tickets.find(t=>t.id===id)}function log(t,text){t.history.push({at:now(),by:staff,text});save()}
function assign(id,owner){const t=ticket(id);t.owner=owner;log(t,'担当者を'+(owner||'未定')+'に変更');render()}
function claim(id){const t=ticket(id);if(t.owner&&t.owner!==staff&&!confirm(t.owner+'から担当を引き継ぎますか？'))return;t.owner=staff;if(t.status==='未対応')t.status='対応中';log(t,'対応を引き受けました');render();toast('担当者と対応状況を更新しました。')}
function statusChange(id,value){const t=ticket(id);if(value==='解決済み'&&!t.answer.trim()){toast('先に解決方法を入力し「解決として登録」を押してください。');render();return}t.status=value;if(value!=='解決済み')t.approved=false;log(t,'対応状況を'+value+'に変更');render()}
function saveNotes(id){const t=ticket(id);t.notes=$('#notes-'+id).value.trim();log(t,'対応状況の説明を更新しました');toast('保存しました。')}
function solve(id){const t=ticket(id),answer=$('#answer-'+id).value.trim();if(!answer){toast('解決方法を入力してください。');return}t.answer=answer;t.notes=$('#notes-'+id).value.trim();t.status='解決済み';t.approved=false;if(!t.owner)t.owner=staff;log(t,'解決方法を登録。FAQは確認待ちです。');render();toast('解決として登録しました。連絡文を確認して案内できます。')}
function approve(id){const t=ticket(id);if(t.status!=='解決済み'||!t.answer.trim()){toast('解決方法を登録してからFAQに採用してください。');return}t.approved=!t.approved;log(t,t.approved?'確認済みFAQに採用しました':'FAQ採用を取り消しました');render()}
let pendingMessage=null;
function draft(id){const t=ticket(id);if(!t.watchers.length){toast('連絡を希望する人はまだいません。');return}showDraft(t,t.watchers,t.status==='解決済み'?'お問い合わせの問題について、解決方法をご案内します。\n\n'+t.answer:'現在の対応状況をご案内します。\n\n'+(t.notes||t.status))}
function direct(id,index){const t=ticket(id),w=t.watchers[index];if(w)showDraft(t,[w],'受付番号'+id+'について、担当者からご連絡します。\n'+(t.status==='解決済み'?t.answer:t.notes))}
function showDraft(t,recipients,body){pendingMessage={id:t.id,recipients};$('#doc-body').innerHTML=`<h2>連絡内容の確認</h2><p class="help">送信先：${recipients.map(w=>esc(w.name)).join('、')}<br>送信者：${esc(staff)}</p><label class="label" for="message-body">連絡文（修正できます）</label><textarea id="message-body" style="min-height:180px" maxlength="6000">${esc(body)}</textarea><p class="help">体験用の「連絡を確認」に追加します。実際のTeamsには送信しません。</p><button class="primary" onclick="sendDemo()">この内容で連絡する（デモ）</button><hr>`;$('#doc').showModal()}
function sendDemo(){const body=$('#message-body').value.trim();if(!body)return;pendingMessage.recipients.forEach(w=>db.messages.unshift({id:uid(),ticketId:pendingMessage.id,contact:w.contact,name:w.name,from:staff,body,at:now(),read:false}));log(ticket(pendingMessage.id),'連絡希望者'+pendingMessage.recipients.length+'名にデモ内で連絡しました');pendingMessage=null;$('#doc').close();render();toast('デモの受信箱に連絡を追加しました。')}
function renderInbox(){const list=db.messages.filter(m=>m.contact===person.contact);$('#app').innerHTML=`<section class="panel"><div class="eyebrow">MESSAGES</div><h2>担当者からの連絡</h2><p class="muted">表示中：${esc(person.name)} ／ ${esc(person.contact)}</p><div class="row"><button class="small" onclick="switchInbox('A')">体験者A</button><button class="small" onclick="switchInbox('B')">体験者B</button></div>${list.map(m=>`<article class="card ${m.read?'':'unread'}"><div class="row"><span class="tag">受付番号 ${esc(m.ticketId)}</span><span class="help">${esc(m.at)} ／ ${esc(m.from)}</span></div><p>${esc(m.body)}</p>${m.read?'<span class="help">確認済み</span>':`<button class="small" onclick="markRead('${m.id}')">確認しました</button>`}</article>`).join('')||'<div class="empty">まだ連絡はありません。<br>相談時に連絡を希望し、担当者の画面から連絡すると表示されます。</div>'}</section>`}
function switchInbox(v){person={name:'体験者'+v,contact:'demo-'+v.toLowerCase()+'@example.invalid'};render()}
function markRead(id){db.messages.find(m=>m.id===id).read=true;save();render()}
function renderSettings(){$('#app').innerHTML=`<div class="split"><section class="panel"><h2>担当者の設定</h2><p class="muted">体験用の担当者を追加できます。</p>${db.staff.map(x=>`<div class="row card"><span>${esc(x)}</span><button class="small danger" onclick="removeStaff('${esc(x)}')">削除</button></div>`).join('')}<form id="staff-form"><label class="label" for="new-staff">担当者名</label><input id="new-staff" required maxlength="50" placeholder="例：担当者D"><button class="primary topgap">担当者を追加</button></form></section><section class="panel"><h2>資料を登録</h2><p class="help">このデモは文章とリンクの登録に対応しています。PDFやWordの自動読み取り・取り込みは行いません。</p><form id="doc-form"><label class="label" for="doc-title">資料名</label><input id="doc-title" required maxlength="200"><label class="label" for="doc-keys">検索する言葉（「,」で区切る）</label><input id="doc-keys" required maxlength="300" placeholder="印刷,プリンター"><label class="label" for="doc-text">説明・手順</label><textarea id="doc-text" required maxlength="10000"></textarea><label class="label" for="doc-url">元資料のリンク（任意・https推奨）</label><input id="doc-url" type="url" placeholder="https://..."><button class="primary topgap">資料を登録</button></form></section></div><section class="panel topgap"><h2>登録済みの資料</h2>${db.docs.map(d=>`<div class="card"><h3>${esc(d.title)}</h3><p class="help">検索する言葉：${esc(d.keys)}</p><div class="row">${docButton(d.id)}<button class="small danger" onclick="removeDoc('${d.id}')">削除</button></div></div>`).join('')}</section>`;$('#staff-form').onsubmit=e=>{e.preventDefault();const name=$('#new-staff').value.trim();if(!name)return;if(/[<>"'&]/.test(name)){toast('担当者名に記号 < > " \u0027 & は使えません。');return}if(db.staff.includes(name)){toast('同じ担当者が登録されています。');return}db.staff.push(name);save();render()};$('#doc-form').onsubmit=e=>{e.preventDefault();const d={id:uid(),title:$('#doc-title').value.trim(),keys:$('#doc-keys').value.trim(),body:$('#doc-text').value.trim(),url:$('#doc-url').value.trim()};if(!d.title||!d.keys||!d.body)return;if(d.url&&!safeURL(d.url)){toast('httpまたはhttpsのリンクを入力してください。');return}db.docs.push(d);save();render();toast('資料を登録しました。新しい相談で試せます。')}}
function removeStaff(name){if(db.staff.length<2){toast('担当者は1人以上必要です。');return}if(db.tickets.some(t=>t.owner===name)){toast('担当中の問い合わせを別の人に引き継いでから削除してください。');return}if(!confirm(name+'を削除しますか？'))return;db.staff=db.staff.filter(x=>x!==name);if(staff===name)staff=db.staff[0];save();render()}
function removeDoc(id){if(!confirm('この資料を削除しますか？'))return;db.docs=db.docs.filter(d=>d.id!==id);save();render()}
function exportCSV(faq){const rows=[['受付番号','種類','質問内容','バージョン','対応状況','担当者','案内・解決方法','参照資料','参照URL','連絡希望人数','FAQ承認'],...db.tickets.filter(t=>!faq||(t.approved&&t.status==='解決済み')).map(t=>{const d=db.docs.find(d=>d.id===t.docId);return [t.id,t.category,t.question,t.version,t.status,t.owner,t.answer,d?.title||'',d?.url||'',t.watchers.length,t.approved?'承認済み':'未承認']})];const safe=v=>{let s=String(v??'');if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const blob=new Blob(['\ufeff'+rows.map(r=>r.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=faq?'icad-faq.csv':'icad-inquiries.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function renderGuide(){$('#app').innerHTML=`<section class="panel"><div class="eyebrow">QUICK START</div><h2>5分で試す、一連の流れ</h2><ol><li>「相談する」で「エラーが出る・うまくいかない」を選び、「更新後にiCADが起動しない」と入力します。</li><li>対応中の問い合わせが表示されたら「同じ問題です」→「連絡を希望する」→連絡先確認→「OK・共有して保存」と進みます。</li><li>利用者を「体験者B」に切り替え、同じ相談を登録します。連絡先は同じ問題の一覧にまとまります。</li><li>「担当者の画面」で担当者Bを選び、「自分が対応する」で引き継ぎます。</li><li>解決方法を入力して「解決として登録」→「確認済みFAQに採用」を押します。</li><li>「連絡希望者への連絡文を確認」で文面を確認し、デモ内で連絡します。</li><li>「連絡を確認」で体験者A・Bへの連絡を確認します。もう一度同じ相談をすると、承認済みの解決方法が案内されます。</li></ol><h3>ほかの試し方</h3><p>「その他の問い合わせ」に「ボタンの場所が分からない」と入力すると、説明と資料へのリンクが表示されます。登録資料にない質問は、担当者への相談に進みます。</p><h3>GitHub Pagesへの置き方</h3><ol><li>このファイルを <b>index.html</b> の名前で保存します。</li><li>GitHubのリポジトリにアップロードし、変更を保存します。</li><li>リポジトリの Settings → Pages を開き、Deploy from a branch、main、/ (root) を選んで保存します。</li><li>表示された公開URLを開きます。追加ライブラリやAPIキーは不要です。</li></ol><h3>本番との違い</h3><p>このデモの回答と類似判定はキーワードによる再現です。実際の画像認識、生成AI、ログイン、担当者の権限確認、複数端末間の共有、資料の自動取り込み、Teams通知、Excelへの自動保存は実装していません。本番ではCopilot Studio・SharePoint・Power Automateなどへ置き換えます。</p><p>画像と送信前の相談は画面を閉じると消えます。了承して保存した相談・連絡先・連絡内容・設定は、このブラウザー内に残ります。公開URL自体から他の人の記録は閲覧できませんが、同じブラウザープロファイルを使う人は記録を見ることができます。</p><h3>データを初期状態に戻す</h3><p class="help">このデモの問い合わせ・資料・連絡・担当者設定を、このブラウザーから消します。</p><button class="danger" onclick="resetAll()">体験データをすべて初期化</button></section>`}
function resetAll(){if(!confirm('このデモで登録したすべてのデータを削除し、初期状態に戻しますか？'))return;db=seed();staff=db.staff[0];person={name:'体験者A',contact:'demo-a@example.invalid'};start();save();render();toast('初期状態に戻しました。')}
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{db=JSON.parse(e.newValue);render()}catch{}}});render();if(!storageOK)toast('ブラウザー保存を利用できません。変更はこの画面を閉じると消える場合があります。');
</script></body></html>
