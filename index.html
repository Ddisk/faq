<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>iCAD相談窓口｜体験デモ</title><style>
:root{color-scheme:dark;--bg:#101725;--panel:#192335;--line:#344257;--text:#edf3ff;--muted:#adbbd0;--blue:#89b9ff;--green:#77dfbd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.8 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#25364e;color:var(--text);padding:10px 16px}button:hover{background:#354e70}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button.primary{background:#96c2ff;color:#10223c;border-color:#96c2ff;font-weight:700}button.small{padding:5px 12px;font-size:14px}button.danger{color:#ffb5b5}input,textarea,select{width:100%;border:1px solid #5b6c84;border-radius:8px;padding:10px;background:#101a2b;color:var(--text)}textarea{min-height:96px;resize:vertical}a{color:var(--blue)}h1{font-size:25px;margin:0}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:10px 0}p{margin:8px 0 16px}header{max-width:1240px;margin:auto;padding:28px 24px 18px;display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{color:var(--green);letter-spacing:.12em;font-size:12px;font-weight:700}.subtitle,.muted{color:var(--muted);font-size:14px}.wrap{max-width:1240px;padding:0 24px 50px;margin:auto}.notice{background:#22304a;border:1px solid #3c5379;border-radius:12px;padding:12px 16px;font-size:13px;color:#d0def4}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs .active{background:var(--text);color:#172239}.grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}.side{align-self:start}.step{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.step b{color:var(--green);margin-right:8px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.chat{max-height:540px;min-height:300px;overflow-y:auto;padding:6px 10px 18px 0;scroll-behavior:smooth}.bubble{background:#26344a;border:1px solid #3a4a62;border-radius:14px 14px 14px 2px;padding:14px 18px;max-width:90%;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{margin-left:auto;background:#204b64;border-radius:14px 14px 2px 14px}.speaker{font-size:11px;color:#b4d8ff;display:block;margin-bottom:3px}.composer{border-top:1px solid var(--line);padding-top:18px}.choices{display:grid;gap:10px}.choices button{text-align:left;padding:17px}.tag{display:inline-block;background:#2c4564;border-radius:999px;padding:2px 10px;font-size:12px}.tag.green{background:#215345;color:#a0f4d2}.tag.amber{background:#5b4625;color:#ffe0a0}.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;background:#162031}.card p{white-space:pre-wrap;overflow-wrap:anywhere}.label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat{background:#111d2e;border-radius:10px;padding:12px}.stat strong{display:block;font-size:25px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#d5f9ec;color:#123c2e;padding:12px 20px;border-radius:12px;z-index:20;max-width:95%}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:680px;width:92%;padding:25px}dialog::backdrop{background:#000a}.preview{max-width:240px;max-height:180px;display:block;border-radius:8px}.topgap{margin-top:16px}.mobile-persona{display:none}.empty{text-align:center;color:var(--muted);padding:35px 10px}summary{cursor:pointer;color:var(--blue)}.help{font-size:13px;color:var(--muted)}footer{margin-top:20px;color:var(--muted);font-size:12px}.unread{border-left:4px solid var(--green)}.hero{max-width:780px;margin:32px auto;text-align:center;padding:40px}.hero .choices{margin:30px auto 12px;max-width:530px}.hero .choices button{padding:22px;font-size:18px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:800px;font-size:14px}th,td{padding:13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:#25364e;white-space:nowrap}td{white-space:pre-wrap;overflow-wrap:anywhere;min-width:110px}td.wide{min-width:230px}.backbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}@media(max-width:760px){header{align-items:start;padding:20px 16px}.wrap{padding:0 16px 35px}.grid,.split{grid-template-columns:1fr}.side{display:none}.mobile-persona{display:block;margin-bottom:14px}.panel{padding:16px}.bubble{max-width:97%}.stats{gap:6px}.stat{padding:8px}.stat strong{font-size:22px}h1{font-size:21px}}@media(prefers-reduced-motion:reduce){.chat{scroll-behavior:auto}}
</style></head><body>
<header><div><div class="eyebrow">ICAD SUPPORT / INTERACTIVE DEMO</div><h1>iCAD相談窓口</h1><div class="subtitle">相談する人にも、対応する人にも、分かりやすく。</div></div><span class="tag">体験デモ</span></header>
<div class="wrap"><div class="notice">このデモは実際のAI・SharePoint・Teams・iCADには接続しません。回答は架空の例です。記録はこのブラウザー内だけに保存され、他の人・端末とは共有されません。画像の文字読み取りは行いません。実際の個人情報や社内資料は入力しないでください。</div>
<nav class="tabs" aria-label="画面切り替え"><button data-tab="home">最初の画面</button><button data-tab="inbox">連絡を確認 <span id="inbox-count"></span></button><button data-tab="guide">試し方・GitHubへの置き方</button></nav>
<main id="app"></main><footer>ブラウザー内保存の体験版です。担当者の切り替えは体験用で、本人確認や権限管理の機能はありません。</footer></div><dialog id="doc"><div id="doc-body"></div><button onclick="document.getElementById('doc').close()">閉じる</button></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const KEY='icad-support-demo-v2';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7), now=()=>new Date().toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',hour12:false});
const seed=()=>({staff:['担当者A','担当者B','担当者C'],docs:[{id:'start',title:'【架空資料】更新後に起動しない場合',keys:'起動,開かない,開始',body:'これは動作確認用の架空資料です。実際のiCADの手順ではありません。\n1. 表示されたメッセージを記録します。\n2. 保存済みの社内更新マニュアルと照合します。\n3. 判断できない場合は担当者に相談します。',url:''},{id:'button',title:'【架空資料】更新前後のボタン配置一覧',keys:'ボタン,配置,場所,メニュー,移動',body:'これは画面の動きを確認するための架空資料です。実際のボタン配置を示すものではありません。\n更新前後の配置を記載した資料から、該当する操作名を調べて案内する想定です。\n本番では、ボタンの旧名称・新名称・配置・該当ページを登録してください。',url:''}],tickets:[{id:'123',category:'エラー',question:'更新後にiCADが起動しない',version:'体験用バージョン',status:'担当者確認中',owner:'担当者A',created:now(),notes:'担当者確認中（架空の例）',answer:'',approved:false,docId:'start',watchers:[],requests:[{name:'体験者A',contact:'demo-a@example.invalid',question:'更新後にiCADが起動しない'}],history:[{at:now(),by:'担当者A',text:'対応を開始しました。'}]}],records:[],messages:[],next:124});
let db,storageOK=true;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed();storageOK=false}let tab='home',staff=db.staff[0]||'担当者',person={name:'体験者A',contact:'demo-a@example.invalid'},session;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{storageOK=false;toast('保存できませんでした。ブラウザーの保存設定・空き容量を確認してください。');return false}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,4200)}
function start(){session={stage:'input',category:'',question:'',version:'',image:null,messages:[{text:'エラー画面の画像を送るか、画面に表示されている文章をそのまま入力してください。\n\nエラー以外のご質問も、こちらに入力できます。\n例：「更新前に使っていたボタンの場所が分からない」'}],answer:'',docId:'',ticketId:null,result:'',notify:false};}
start();
function say(text,user=false){session.messages.push({text,user})}
function go(t){captureDraft();tab=t;render();window.scrollTo(0,0)}
function captureDraft(){if(tab==='chat'&&session.stage==='input'&&$('#question')){session.question=$('#question').value;session.version=$('#version').value}if(tab==='chat'&&session.stage==='summary'&&$('#summary-q')){session.question=$('#summary-q').value;session.answer=$('#summary-answer').value}}
function backBar(){return '<div class="backbar"><button class="small" onclick="go(\'staffMenu\')">← 担当者メニューに戻る</button><button class="small" onclick="go(\'home\')">最初の画面に戻る</button></div>'}
function renderHome(){$('#app').innerHTML=`<section class="panel hero"><div class="eyebrow">ようこそ</div><h2>iCAD相談窓口へようこそ。</h2><p class="muted">ご利用の目的を選んでください。</p><div class="choices"><button class="primary" onclick="go('chat')">問い合わせをする方 →</button><button onclick="go('staffMenu')">iCAD担当者の方 →</button></div><p class="help">エラー・操作方法・更新後の変更点など、まとめて相談できます。</p></section>`}
function renderStaffMenu(){$('#app').innerHTML=`<section class="panel hero"><div class="eyebrow">担当者メニュー</div><h2>行いたいことを選んでください。</h2><div class="choices"><button class="primary" onclick="go('admin')">問い合わせを確認・対応する</button><button onclick="go('chat')">自分も問い合わせをする</button><button onclick="go('records')">保存された5項目を見る</button><button onclick="go('settings')">資料・担当者を設定する</button><button onclick="go('home')">← 最初の画面に戻る</button></div><p class="help">このデモは画面の切り替えのみです。本番では会社のアカウントで担当者を確認します。</p></section>`}

document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#inbox-count').textContent=db.messages.filter(m=>m.contact===person.contact&&!m.read).length||'';({home:renderHome,staffMenu:renderStaffMenu,chat:renderChat,admin:renderAdmin,records:renderRecords,inbox:renderInbox,settings:renderSettings,guide:renderGuide})[tab]();}
function personaSelect(id){return `<label class="label" for="${id}">体験する利用者</label><select id="${id}" onchange="changePerson(this.value)"><option value="A" ${person.name==='体験者A'?'selected':''}>体験者A</option><option value="B" ${person.name==='体験者B'?'selected':''}>体験者B</option></select>`}
function renderChat(){const s=session;$('#app').innerHTML=`<div class="backbar"><button class="small" onclick="go('home')">← 最初の画面に戻る</button><button class="small" onclick="go('staffMenu')">担当者メニューへ</button></div><div class="grid"><aside class="panel side"><div class="eyebrow">相談の流れ</div><h2>一つずつ、ご案内します</h2><div class="step"><b>01</b>画像・質問を送る</div><div class="step"><b>02</b>案内や対応状況を確認</div><div class="step"><b>03</b>解決したか確認</div><div class="step"><b>04</b>要約を確認して保存</div><p class="help topgap">担当者と共有する前に確認します。</p>${personaSelect('persona')}<p class="help">利用者を変えて同じ質問をすると、連絡希望者の登録を試せます。</p></aside><section class="panel"><div class="row" style="justify-content:space-between"><div><h2>問い合わせ</h2><span class="muted">${esc(person.name)} ／ 自動応答の体験</span></div><button class="small" onclick="resetChat()">新しい問い合わせ</button></div><div class="mobile-persona">${personaSelect('mobile-persona')}</div><div class="chat" id="chat-log" role="log" aria-label="相談のやり取り">${s.messages.map(m=>`<div class="bubble ${m.user?'user':''}"><span class="speaker">${m.user?'あなた':'iCAD相談窓口'}</span>${esc(m.text)}</div>`).join('')}${s.image?`<div class="card"><span class="help">受付画像（画面内のみ・記録には保存しません）</span><img class="preview" src="${s.image}" alt="受け付けた画像"><button class="small" onclick="session.image=null;render()">画像を取り消す</button><p class="help">デモは文字を読み取れません。画像の内容を文章でも入力してください。</p></div>`:''}</div><div class="composer" id="composer"></div></section></div>`;
const c=$('#composer');
if(s.stage==='input')c.innerHTML=`<form id="question-form"><label class="label" for="question">質問内容・画面に表示された文章</label><textarea id="question" required maxlength="3000" placeholder="例：更新後にiCADが起動しない／ボタンの場所が分からない">${esc(s.question)}</textarea><label class="label" for="image">画像を添付（任意・PNG／JPEG／WebP・3MBまで）</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp" onchange="attachImage(this)"><label class="label" for="version">iCADのバージョン（任意）</label><input id="version" maxlength="100" placeholder="分からなければ空欄で大丈夫です" value="${esc(s.version)}"><details class="topgap"><summary>体験用の入力例を見る</summary><p class="help">「起動しない」→担当者確認中の案内<br>「ボタンの場所が分からない」→資料の案内<br>「更新に時間がかかる」→担当者への相談<br>どの質問でも、担当者への相談と保存へ進めます。</p></details><button class="primary topgap" type="submit">送信</button></form>`;
if(s.stage==='match')c.innerHTML=`<p>この問題と、状況は同じですか？</p><div class="row"><button class="primary" onclick="confirmMatch()">同じ問題です</button><button onclick="different()">自分の状況は違います</button></div>`;
if(s.stage==='result')c.innerHTML=`${docButton(s.docId)}<p class="topgap">問題は解決しましたか？</p><div class="row"><button class="primary" onclick="resolved()">解決した</button><button onclick="unresolved()">まだ解決していない</button><button onclick="unresolved()">担当者に相談したい</button></div>`;
if(s.stage==='notify')c.innerHTML=`<p>解決後、チャットで連絡を受け取りますか？</p><div class="row"><button class="primary" onclick="wantContact(true)">連絡を希望する</button><button onclick="wantContact(false)">連絡は不要</button></div>`;
if(s.stage==='identity')c.innerHTML=`<form id="identity-form"><p>連絡先を確認してください。</p><label class="label" for="name">名前（体験用）</label><input id="name" required maxlength="80" value="${esc(person.name)}"><label class="label" for="contact">会社のアカウント（体験用）</label><input id="contact" type="email" required maxlength="200" value="${esc(person.contact)}"><p class="help">実際のTeamsでは、会社のアカウントと結び付ける想定です。</p><button class="primary topgap">この連絡先で進む</button></form>`;
if(s.stage==='summary')c.innerHTML=`<div class="card"><h3>今回の相談内容のまとめ</h3><p class="help">デモは質問と案内をそのまままとめます。本番ではAIによる要約に置き換えます。</p><label class="label" for="summary-q">質問内容（修正できます）</label><textarea id="summary-q" maxlength="3000">${esc(s.question)}</textarea><label class="label" for="summary-answer">回答内容（修正できます）</label><textarea id="summary-answer" maxlength="6000">${esc(s.answer)}</textarea><p>問い合わせした人：${esc(person.name)}<br>状況：${s.result==='解決'?'解決':'担当者確認中（保存・引き継ぎ後）'}<br>解決後の連絡：${s.notify?'希望する':'不要'}</p>${docButton(s.docId)}</div><p>この内容を担当者に伝え、今後の問い合わせ対応に使うために保存してもよいですか？</p><div class="row"><button class="primary" onclick="commit()">OK・共有して保存</button><button onclick="decline()">共有・保存しない</button></div><p class="help">保存するのは、受付日時・問い合わせした人・質問内容・回答内容・状況の5項目です。担当者と連絡先は別に管理する想定です。このデモはブラウザー内に保存します。</p>`;
if(s.stage==='done')c.innerHTML='<div class="row"><button class="primary" onclick="resetChat()">新しく問い合わせる</button><button onclick="go(\'home\')">最初の画面に戻る</button></div>';
if($('#question-form'))$('#question-form').onsubmit=e=>{e.preventDefault();ask()};if($('#identity-form'))$('#identity-form').onsubmit=e=>{e.preventDefault();person={name:$('#name').value.trim(),contact:$('#contact').value.trim().toLowerCase()};if(!person.name)return;makeSummary()};$('#chat-log').scrollTop=$('#chat-log').scrollHeight;}
function resetChat(){if(session.question&&session.stage!=='done'&&!confirm('現在の相談を終了して、新しい問い合わせを始めますか？'))return;start();tab='chat';render()}
function changePerson(v){if(session.question&&session.stage!=='done'&&!confirm('利用者を変更すると、送信前の相談は消えます。変更しますか？')){render();return}person={name:'体験者'+v,contact:'demo-'+v.toLowerCase()+'@example.invalid'};start();render()}
function attachImage(input){const f=input.files[0];if(!f)return;session.question=$('#question').value;session.version=$('#version').value;if(f.size>3*1024*1024||!['image/png','image/jpeg','image/webp'].includes(f.type)){input.value='';toast('PNG・JPEG・WebPの画像を3MB以内で選んでください。');return}const r=new FileReader();r.onload=()=>{session.image=r.result;render()};r.readAsDataURL(f)}
function docButton(id){const d=db.docs.find(d=>d.id===id);return d?`<button class="small" onclick="openDoc('${d.id}')">資料を開く：${esc(d.title)}</button>`:''}
function openDoc(id){const d=db.docs.find(x=>x.id===id);if(!d)return;$('#doc-body').innerHTML=`<span class="tag">登録資料</span><h2>${esc(d.title)}</h2><p style="white-space:pre-wrap">${esc(d.body)}</p>${safeURL(d.url)?`<p><a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">元の資料を開く ↗</a></p>`:'<p class="help">架空資料のため、外部リンクは登録されていません。</p>'}`;$('#doc').showModal()}
function safeURL(s){try{return ['https:','http:'].includes(new URL(s).protocol)}catch{return false}}
function relevant(q,t){return q.replace(/\s/g,'')===t.question.replace(/\s/g,'')||(/起動|開かない/.test(q)&&/起動|開かない/.test(t.question))}
function ask(){const s=session;s.question=$('#question').value.trim();s.version=$('#version').value.trim();if(!s.question)return;s.category=/エラー|起動|開かない|うまく|できない|止ま|失敗/.test(s.question)?'エラー':'その他';say(s.question+(s.version?'\nバージョン：'+s.version:''),true);const match=db.tickets.find(t=>relevant(s.question,t)&&(!s.version||!t.version||t.version==='体験用バージョン'||s.version===t.version)&&(t.status!=='解決'||t.approved));if(match){s.ticketId=match.id;s.docId=match.docId||'';say('似た内容の問い合わせが見つかりました。\n受付番号：'+match.id+'\n内容：'+match.question+'\n対象バージョン：'+(match.version||'未確認')+'\n状態：'+match.status+'\n\n同じ問題か確認してください。（デモでは単純なキーワード照合です）');s.stage='match';render();return}answerFromDocs()}
function confirmMatch(){const t=db.tickets.find(t=>t.id===session.ticketId);if(!t){toast('問い合わせが見つかりません。もう一度相談してください。');return}if(t.status==='解決'&&t.approved){session.answer=t.answer;session.stage='result';say('確認済みの解決事例をご案内します。\n'+t.answer)}else{session.answer='受付番号'+t.id+'：'+(t.status==='担当者確認中'?'この問題は、現在担当者が対応しています。':'同じ内容の問い合わせがありますが、まだ解決していません。')+(t.notes?'\n状況：'+t.notes:'');session.result='未解決';session.stage='notify';say(session.answer)}render()}
function different(){session.ticketId=null;say('状況が異なるため、別の問い合わせとして進めます。');answerFromDocs()}
function answerFromDocs(){const s=session;const d=db.docs.find(d=>d.keys.split(/[,、]/).map(k=>k.trim()).filter(Boolean).some(k=>s.question.includes(k)));if(d){s.docId=d.id;s.answer=d.body;say('登録資料「'+d.title+'」をもとにした案内例です。\n'+d.body);s.stage='result'}else{s.answer='該当する解決方法が見つからないため、担当者への確認が必要です。';s.result='未解決';s.stage='notify';say(s.answer)}render()}
function resolved(){session.result='解決';session.notify=false;say('解決した',true);makeSummary()}
function unresolved(){session.result='未解決';session.stage='notify';say('まだ解決していない',true);say('担当者に相談するため、ここまでの内容をまとめます。');render()}
function wantContact(want){session.notify=want;say(want?'連絡を希望する':'連絡は不要',true);if(want){session.stage='identity';render()}else makeSummary()}
function makeSummary(){session.stage='summary';say('内容を確認し、共有・保存するか選んでください。');render()}
function commit(){const s=session;s.question=$('#summary-q').value.trim();s.answer=$('#summary-answer').value.trim();if(!s.question||!s.answer){toast('質問内容と回答内容を入力してください。');return}const previous=JSON.stringify(db);let t=db.tickets.find(t=>t.id===s.ticketId);if(!t||t.status==='解決'||s.result==='解決'){t={id:String(db.next++),category:s.category,question:s.question,version:s.version,status:s.result==='解決'?'解決':'担当者確認中',owner:'',created:now(),notes:'',answer:s.answer,approved:false,docId:s.docId,watchers:[],requests:[],history:[]};db.tickets.unshift(t)}else{t.status='担当者確認中'}const d=db.docs.find(d=>d.id===s.docId);const answer=s.answer+(d?'\n参照資料：'+d.title+(d.url?'\n'+d.url:''):'');const r={id:uid(),ticketId:t.id,created:now(),name:person.name,question:s.question,answer,status:s.result==='解決'?'解決':'担当者確認中'};db.records.push(r);t.requests.push({name:person.name,contact:person.contact,question:s.question});if(s.notify&&!t.watchers.some(w=>w.contact===person.contact))t.watchers.push({...person,sent:false});t.history.push({at:now(),by:person.name,text:'相談内容の共有・保存に同意'+(s.notify?'。解決後の連絡を希望':'')});if(!save()){db=JSON.parse(previous);return}s.stage='done';say('問い合わせを受け付けました。\n受付番号：'+t.id+'\n状況：'+r.status+'\n'+(s.notify?'連絡先を登録しました。解決後の連絡をお待ちください。':'解決後の連絡は希望しない設定です。')+'\n（デモ内の問い合わせ一覧に保存しました。SharePointへの送信は行っていません）');render()}
function decline(){session.stage='done';say('共有・保存は行いませんでした。担当者への相談と連絡希望も登録していません。\n相談内容と画像は「新しく問い合わせる」で消えます。');render()}
function renderAdmin(){const tickets=db.tickets;$('#app').innerHTML=backBar()+`<section class="panel"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">SUPPORT DESK</div><h2>担当者の画面</h2></div><div><label class="label" for="staff">操作する担当者（体験用）</label><select id="staff" onchange="staff=this.value;render()">${db.staff.map(x=>`<option ${x===staff?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><p class="muted">全担当者が同じ一覧を確認し、対応を引き受けたり、引き継いだりできます。</p><div class="stats"><div class="stat"><span class="help">未解決</span><strong>${tickets.filter(t=>t.status==='未解決').length}</strong></div><div class="stat"><span class="help">担当者確認中</span><strong>${tickets.filter(t=>['担当者確認中'].includes(t.status)).length}</strong></div><div class="stat"><span class="help">承認済みFAQ</span><strong>${tickets.filter(t=>t.approved&&t.status==='解決').length}</strong></div></div><div class="row"><button class="small" onclick="go('records')">保存された5項目を見る</button><button class="small" onclick="exportCSV(false)">5項目をCSVで保存</button><button class="small" onclick="exportCSV(true)">承認済みFAQをCSVで保存</button></div><p class="help">SharePointのリストに保存する想定の5項目です。CSVはExcelで開けます。このデモからSharePointへの自動保存は行いません。</p>${tickets.map(t=>`<article class="card"><div class="row"><span class="tag ${t.status==='解決'?'green':'amber'}">${esc(t.status)}</span><span class="muted">受付番号 ${esc(t.id)} ／ ${esc(t.created)}</span></div><h3>${esc(t.question)}</h3><p class="help">${esc(t.category)} ／ バージョン：${esc(t.version||'未確認')} ／ 相談 ${t.requests.length}件 ／ 連絡希望 ${t.watchers.length}名</p><div class="split"><div><label class="label" for="owner-${t.id}">主な担当者</label><select id="owner-${t.id}" onchange="assign('${t.id}',this.value)"><option value="">未定</option>${db.staff.map(x=>`<option ${x===t.owner?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="small topgap" onclick="claim('${t.id}')">自分が対応する</button><label class="label" for="state-${t.id}">対応状況</label><select id="state-${t.id}" onchange="statusChange('${t.id}',this.value)">${['未解決','担当者確認中','解決'].map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select><label class="label" for="notes-${t.id}">利用者にも案内する対応状況</label><textarea id="notes-${t.id}" maxlength="3000">${esc(t.notes)}</textarea><button class="small" onclick="saveNotes('${t.id}')">対応状況を保存</button></div><div><label class="label" for="answer-${t.id}">解決方法・利用者への連絡内容</label><textarea id="answer-${t.id}" maxlength="5000" placeholder="確認できた操作方法と注意事項を入力">${esc(t.answer||'')}</textarea><div class="row topgap"><button class="primary small" onclick="solve('${t.id}')">解決として登録</button><button class="small" onclick="approve('${t.id}')">${t.approved?'FAQ採用を取り消す':'確認済みFAQに採用'}</button></div><p class="help">${t.approved?'確認済みFAQとして次の相談に使用します。':'FAQへの採用前は、解決でも自動回答には使用しません。'}</p><button class="small" onclick="draft('${t.id}')">連絡希望者への連絡文を確認</button></div></div><details class="topgap"><summary>相談者・連絡希望者・対応履歴を見る</summary><h3>相談者</h3>${t.requests.map(r=>`<p class="help">${esc(r.name)} ／ ${esc(r.contact)}<br>${esc(r.question)}</p>`).join('')}<h3>解決後の連絡希望者</h3>${t.watchers.map((w,wi)=>`<p class="help">${esc(w.name)} ／ ${esc(w.contact)} ／ ${w.sent?'連絡済み':'未連絡'} <button class="small" onclick="direct('${t.id}',${wi})">個別に連絡</button></p>`).join('')||'<p class="help">登録はありません。</p>'}<h3>対応履歴</h3>${t.history.map(h=>`<p class="help">${esc(h.at)} ／ ${esc(h.by)}<br>${esc(h.text)}</p>`).join('')}</details></article>`).join('')||'<p class="empty">問い合わせはありません。</p>'}</section>`}
function ticket(id){return db.tickets.find(t=>t.id===id)}
function syncRecords(t){db.records.filter(r=>r.ticketId===t.id).forEach(r=>{r.status=t.status;if(t.status==='解決'){const d=db.docs.find(d=>d.id===t.docId);r.answer=t.answer+(d?'\n参照資料：'+d.title+(d.url?'\n'+d.url:''):'')}})}
function log(t,text){t.history.push({at:now(),by:staff,text});syncRecords(t);return save()}
function assign(id,owner){const t=ticket(id);t.owner=owner;log(t,'担当者を'+(owner||'未定')+'に変更');render()}
function claim(id){const t=ticket(id);if(t.owner&&t.owner!==staff&&!confirm(t.owner+'から担当を引き継ぎますか？'))return;t.owner=staff;if(t.status==='未解決')t.status='担当者確認中';log(t,'対応を引き受けました');render();toast('担当者と対応状況を更新しました。')}
function statusChange(id,value){const t=ticket(id);if(value==='解決'){toast('解決方法を入力し「解決として登録」を押してください。');render();return}t.status=value;t.approved=false;log(t,'状況を'+value+'に変更');render()}
function saveNotes(id){const t=ticket(id);t.notes=$('#notes-'+id).value.trim();log(t,'対応状況の説明を更新しました');toast('保存しました。')}
function solve(id){const t=ticket(id),answer=$('#answer-'+id).value.trim();if(!answer){toast('解決方法を入力してください。');return}t.answer=answer;t.notes=$('#notes-'+id).value.trim();t.status='解決';t.approved=false;if(!t.owner)t.owner=staff;log(t,'解決方法を登録。FAQは確認待ちです。');render();toast('解決として登録しました。連絡文を確認して案内できます。')}
function approve(id){const t=ticket(id);if(t.status!=='解決'||!t.answer.trim()){toast('解決方法を登録してからFAQに採用してください。');return}t.approved=!t.approved;log(t,t.approved?'確認済みFAQに採用しました':'FAQ採用を取り消しました');render()}
let pendingMessage=null;
function draft(id){const t=ticket(id);if(!t.watchers.length){toast('連絡を希望する人はまだいません。');return}showDraft(t,t.watchers,t.status==='解決'?'お問い合わせの問題について、解決方法をご案内します。\n\n'+t.answer:'現在の対応状況をご案内します。\n\n'+(t.notes||t.status))}
function direct(id,index){const t=ticket(id),w=t.watchers[index];if(w)showDraft(t,[w],'受付番号'+id+'について、担当者からご連絡します。\n'+(t.status==='解決'?t.answer:t.notes))}
function showDraft(t,recipients,body){pendingMessage={id:t.id,recipients};$('#doc-body').innerHTML=`<h2>連絡内容の確認</h2><p class="help">送信先：${recipients.map(w=>esc(w.name)).join('、')}<br>送信者：${esc(staff)}</p><label class="label" for="message-body">連絡文（修正できます）</label><textarea id="message-body" style="min-height:180px" maxlength="6000">${esc(body)}</textarea><p class="help">体験用の「連絡を確認」に追加します。実際のTeamsには送信しません。</p><button class="primary" onclick="sendDemo()">この内容で連絡する（デモ）</button><hr>`;$('#doc').showModal()}
function sendDemo(){const body=$('#message-body').value.trim();if(!body||!pendingMessage)return;const previous=JSON.stringify(db),t=ticket(pendingMessage.id);pendingMessage.recipients.forEach(w=>{db.messages.unshift({id:uid(),ticketId:t.id,contact:w.contact,name:w.name,from:staff,body,at:now(),read:false});const actual=t.watchers.find(x=>x.contact===w.contact);if(actual)actual.sent=true});if(!log(t,'連絡希望者'+pendingMessage.recipients.length+'名にデモ内で連絡しました')){db=JSON.parse(previous);return}pendingMessage=null;$('#doc').close();render();toast('デモの受信箱に連絡を追加しました。')}
function renderInbox(){const list=db.messages.filter(m=>m.contact===person.contact);$('#app').innerHTML='<div class="backbar"><button class="small" onclick="go(\'home\')">← 最初の画面に戻る</button></div>'+`<section class="panel"><div class="eyebrow">MESSAGES</div><h2>担当者からの連絡</h2><p class="muted">表示中：${esc(person.name)} ／ ${esc(person.contact)}</p><div class="row"><button class="small" onclick="switchInbox('A')">体験者A</button><button class="small" onclick="switchInbox('B')">体験者B</button></div>${list.map(m=>`<article class="card ${m.read?'':'unread'}"><div class="row"><span class="tag">受付番号 ${esc(m.ticketId)}</span><span class="help">${esc(m.at)} ／ ${esc(m.from)}</span></div><p>${esc(m.body)}</p>${m.read?'<span class="help">確認済み</span>':`<button class="small" onclick="markRead('${m.id}')">確認しました</button>`}</article>`).join('')||'<div class="empty">まだ連絡はありません。<br>相談時に連絡を希望し、担当者の画面から連絡すると表示されます。</div>'}</section>`}
function switchInbox(v){person={name:'体験者'+v,contact:'demo-'+v.toLowerCase()+'@example.invalid'};render()}
function markRead(id){db.messages.find(m=>m.id===id).read=true;save();render()}
function renderSettings(){$('#app').innerHTML=backBar()+`<div class="split"><section class="panel"><h2>担当者の設定</h2><p class="muted">体験用の担当者を追加できます。</p>${db.staff.map(x=>`<div class="row card"><span>${esc(x)}</span><button class="small danger" onclick="removeStaff('${esc(x)}')">削除</button></div>`).join('')}<form id="staff-form"><label class="label" for="new-staff">担当者名</label><input id="new-staff" required maxlength="50" placeholder="例：担当者D"><button class="primary topgap">担当者を追加</button></form></section><section class="panel"><h2>資料を登録</h2><p class="help">このデモは文章とリンクの登録に対応しています。PDFやWordの自動読み取り・取り込みは行いません。</p><form id="doc-form"><label class="label" for="doc-title">資料名</label><input id="doc-title" required maxlength="200"><label class="label" for="doc-keys">検索する言葉（「,」で区切る）</label><input id="doc-keys" required maxlength="300" placeholder="印刷,プリンター"><label class="label" for="doc-text">説明・手順</label><textarea id="doc-text" required maxlength="10000"></textarea><label class="label" for="doc-url">元資料のリンク（任意・https推奨）</label><input id="doc-url" type="url" placeholder="https://..."><button class="primary topgap">資料を登録</button></form></section></div><section class="panel topgap"><h2>登録済みの資料</h2>${db.docs.map(d=>`<div class="card"><h3>${esc(d.title)}</h3><p class="help">検索する言葉：${esc(d.keys)}</p><div class="row">${docButton(d.id)}<button class="small danger" onclick="removeDoc('${d.id}')">削除</button></div></div>`).join('')}</section>`;$('#staff-form').onsubmit=e=>{e.preventDefault();const name=$('#new-staff').value.trim();if(!name)return;if(/[<>"'&]/.test(name)){toast('担当者名に記号 < > " \u0027 & は使えません。');return}if(db.staff.includes(name)){toast('同じ担当者が登録されています。');return}db.staff.push(name);save();render()};$('#doc-form').onsubmit=e=>{e.preventDefault();const d={id:uid(),title:$('#doc-title').value.trim(),keys:$('#doc-keys').value.trim(),body:$('#doc-text').value.trim(),url:$('#doc-url').value.trim()};if(!d.title||!d.keys||!d.body)return;if(d.url&&!safeURL(d.url)){toast('httpまたはhttpsのリンクを入力してください。');return}db.docs.push(d);save();render();toast('資料を登録しました。新しい相談で試せます。')}}
function removeStaff(name){if(db.staff.length<2){toast('担当者は1人以上必要です。');return}if(db.tickets.some(t=>t.owner===name)){toast('担当中の問い合わせを別の人に引き継いでから削除してください。');return}if(!confirm(name+'を削除しますか？'))return;db.staff=db.staff.filter(x=>x!==name);if(staff===name)staff=db.staff[0];save();render()}
function removeDoc(id){if(!confirm('この資料を削除しますか？'))return;db.docs=db.docs.filter(d=>d.id!==id);save();render()}
const COLUMNS=['受付日時','問い合わせした人','質問内容','回答内容','状況'];
function recordRows(faq){return faq?db.tickets.filter(t=>t.approved&&t.status==='解決').map(t=>({created:t.created,name:t.requests[0]?.name||'',question:t.question,answer:t.answer,status:'解決'})):db.records}
function renderRecords(){const rows=recordRows(false);$('#app').innerHTML=backBar()+`<section class="panel"><div class="eyebrow">保存先のイメージ</div><h2>SharePointに保存する問い合わせ一覧</h2><p class="muted">表示・出力は指定の5項目です。連絡先と対応担当者は、受付番号に結び付けて別管理する想定です。</p><div class="row"><button class="primary small" onclick="exportCSV(false)">この5項目をCSVで保存</button><button class="small" onclick="go('admin')">問い合わせの対応画面へ</button></div><div class="table-wrap topgap"><table><thead><tr>${COLUMNS.map(c=>`<th scope="col">${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.created)}</td><td>${esc(r.name)}</td><td class="wide">${esc(r.question)}</td><td class="wide">${esc(r.answer)}</td><td><span class="tag ${r.status==='解決'?'green':'amber'}">${esc(r.status)}</span></td></tr>`).join('')||'<tr><td colspan="5">まだ保存された問い合わせはありません。質問後に「OK・共有して保存」を選んでください。</td></tr>'}</tbody></table></div><p class="help">受付日時は保存時の日本時間です。担当者が解決を登録すると、同じ問題に結び付く記録の回答内容と状況も更新されます。</p></section>`}
function exportCSV(faq){const rows=[COLUMNS,...recordRows(faq).map(r=>[r.created,r.name,r.question,r.answer,r.status])];const safe=v=>{let s=String(v??'');if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const blob=new Blob(['\ufeff'+rows.map(r=>r.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=faq?'icad-faq.csv':'icad-inquiries.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function renderGuide(){$('#app').innerHTML=`<section class="panel"><div class="eyebrow">使い方・構成</div><h2>5分で試す、一連の流れ</h2><ol><li>最初の画面で「問い合わせをする方」を選びます。追加の2択は出ません。</li><li>「更新後にiCADが起動しない」と入力して送信します。</li><li>「同じ問題です」→「連絡を希望する」→連絡先確認→「OK・共有して保存」と進みます。</li><li>体験者Bでも同じ内容を登録すると、同じ問題の連絡希望者に追加されます。</li><li>最初の画面→「iCAD担当者の方」→「問い合わせを確認・対応する」で、操作担当者を選びます。「自分が対応する」で担当を引き受けられます。</li><li>解決方法を入力し「解決として登録」を押します。「確認済みFAQに採用」で次の相談に利用されます。</li><li>「連絡希望者への連絡文を確認」で文面と宛先を確認し、デモ内で連絡します。「連絡を確認」で受信内容を見られます。</li><li>担当者メニューの「保存された5項目を見る」で、保存先のイメージを確認できます。</li></ol><h3>エラー以外も同じ入口です</h3><p>「ボタンの場所が分からない」と送ると、登録資料をもとに案内し、資料を開くボタンを表示します。解決しない場合は、エラーと同じように担当者へ相談できます。</p><h3>画面と処理の役割</h3><div class="table-wrap"><table><thead><tr><th>役割</th><th>本番で使うもの</th></tr></thead><tbody><tr><td>受付・質問・確認・戻る</td><td>Copilot Studioのトピック</td></tr><tr><td>画像・質問の理解、回答と要約</td><td>利用環境に対応したAI機能（別途設定・検証）</td></tr><tr><td>マニュアル・メーカー資料</td><td>SharePointのファイル置き場</td></tr><tr><td>問い合わせ・FAQ・連絡希望者</td><td>SharePointのリスト</td></tr><tr><td>保存・状況の取得・担当者への通知</td><td>Power Automateまたはエージェントフロー</td></tr></tbody></table></div><h3>SharePointの保存項目</h3><p>受付日時／問い合わせした人／質問内容／回答内容／状況。状況は「解決・担当者確認中・未解決」の3択です。保存日時と利用者名はフローから登録し、連絡先・担当者・受付番号は別の管理情報として関連付けます。</p><h3>メーカー情報とWeb検索</h3><p>本番では取り込み済みのメーカーFAQと承認済みの社内事例を先に参照します。公開Web検索は別途設定し、出典を付け、未確認の情報として区別します。会員向けサポートサイトへの自動ログインや全文収集は、このデモにはありません。</p><h3>GitHub Pagesへの置き方</h3><ol><li>ファイル名を <b>index.html</b> にして、リポジトリへアップロードします。</li><li>Settings → Pages → Deploy from a branch を選択します。</li><li>公開するブランチと / (root) を選んで保存し、表示されたURLを開きます。</li></ol><h3>本番との違い</h3><p>これは画面と処理の流れを確認するデモです。回答・類似判定は単純なキーワード照合です。生成AI、画像の文字読み取り、PDF・Wordの自動取り込み、公開Web検索、会社アカウントでの認証、担当者権限、SharePoint保存、Teams送信、端末間の共有には接続していません。</p><p>画像は添付・表示だけです。読み取りを行わないため、デモでは文章も入力してください。質問と案内のまとめは手動で直せます。登録資料の本文と外部リンクも手入力で追加できます。</p><p>了承して保存した相談・連絡先・連絡内容・設定は、このブラウザー内に残ります。画像と保存前の相談はページを閉じると消えます。同じブラウザープロファイルを使う人は保存記録を見ることができます。</p><p>旧版の体験記録はそのまま残し、この版では別の保存領域を使います。</p><h3>データを初期状態に戻す</h3><p class="help">この版の問い合わせ・資料・連絡・担当者設定をブラウザーから
